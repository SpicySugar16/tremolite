<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>透闪石 Tremolite · Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;
  --fg:#e6edf3;--fg2:#8b949e;--fg3:#6e7681;
  --accent:#66ccff;--accent2:#99ddff;--accent-dim:#66ccff22;--accent-border:#66ccff44;
  --border:#30363d;--border2:#21262d;
  --green:#3fb950;--red:#f85149;--yellow:#d29922;
  --font:-apple-system,'SF Pro','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --mono:'SF Mono','Cascadia Code','JetBrains Mono',monospace;
  --radius:8px;--radius-sm:4px;
}
body{background:var(--bg);color:var(--fg);font-family:var(--font);min-height:100vh}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:10px}
.topbar h1{color:var(--accent);font-size:1.1rem;font-weight:600}
.topbar .badge{display:inline-block;background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent-border);border-radius:12px;padding:2px 10px;font-size:0.72rem}
.topbar .sub{color:var(--fg2);font-size:0.75rem;margin-left:auto}
.layout{display:grid;grid-template-columns:200px 1fr;height:calc(100vh - 46px)}
.sidebar{background:var(--bg2);border-right:1px solid var(--border);padding:10px 0;overflow-y:auto;min-height:0;height:100%}
.sidebar .sep{border-top:1px solid var(--border);margin:6px 12px}
.nav-item{padding:7px 16px;cursor:pointer;font-size:0.82rem;color:var(--fg2);transition:all 0.15s;display:flex;align-items:center;gap:6px}
.nav-item:hover{background:var(--accent-dim);color:var(--fg)}
.nav-item.active{background:var(--accent-dim);color:var(--accent);border-right:2px solid var(--accent)}
.nav-item .ico{font-size:0.9rem;width:18px;text-align:center}
.nav-item .ver{font-size:0.62rem;color:var(--fg3);margin-left:auto}
.content{overflow-y:auto;padding:16px 20px}
.card{background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.card-hd h3{color:var(--accent);font-size:0.78rem;text-transform:uppercase;letter-spacing:0.5px}
.row{display:flex;justify-content:space-between;padding:4px 0;font-size:0.82rem}
.row .l{color:var(--fg2)}
.row .v{color:var(--fg);font-weight:500}
.badge-accent{display:inline-block;background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent-border);border-radius:12px;padding:2px 10px;font-size:0.78rem}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:var(--bg3);color:var(--fg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 14px;cursor:pointer;font-size:0.78rem;transition:all 0.15s}
.btn:hover{background:var(--accent-dim);border-color:var(--accent-border);color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:0.72rem}
.btn.accent{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
.loading{color:var(--fg2);font-size:0.82rem;text-align:center;padding:20px}
.error{color:var(--red);font-size:0.82rem;text-align:center;padding:20px}
.chat-log{border:1px solid var(--border2);border-radius:var(--radius);padding:10px;max-height:400px;overflow-y:auto;font-size:0.82rem;margin-bottom:10px}
.chat-entry{padding:5px 0;border-bottom:1px solid var(--bg3)}
.chat-entry:last-child{border:none}
.chat-entry .sender{color:var(--accent);font-weight:600;font-size:0.78rem}
.chat-entry .text{color:var(--fg);margin-top:2px;line-height:1.4}
.chat-entry.user .sender{color:var(--green)}
.chat-input{display:flex;gap:8px}
.chat-input input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;color:var(--fg);font-size:0.85rem;outline:none}
.chat-input input:focus{border-color:var(--accent)}
.chat-input button{background:var(--accent);color:var(--bg);border:none;border-radius:var(--radius-sm);padding:8px 16px;font-weight:600;cursor:pointer;font-size:0.85rem}
.chat-input button:hover{background:var(--accent2)}
.module-list{font-size:0.78rem;display:flex;flex-wrap:wrap;gap:4px}
.module-list .mod{display:inline-block;background:var(--bg3);border-radius:var(--radius-sm);padding:2px 8px;color:var(--fg2);font-size:0.72rem}
.module-list .mod.active{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent-border)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:var(--border);border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);cursor:pointer;margin-top:-4.5px}
input[type=number]{font-family:var(--mono);font-size:0.72rem;width:38px;height:20px;padding:1px 2px;text-align:center;border:1px solid var(--border);border-radius:3px;background:var(--bg);color:var(--fg);-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.toggle{position:relative;display:inline-block;width:32px;height:18px}
.toggle input{opacity:0;width:0;height:0}
.toggle .sl{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--bg3);border-radius:18px;transition:0.2s;border:1px solid var(--border)}
.toggle .sl:before{position:absolute;content:"";height:12px;width:12px;left:2px;bottom:2px;background:var(--fg2);border-radius:50%;transition:0.2s}
.toggle input:checked+.sl{background:var(--accent-dim);border-color:var(--accent-border)}
.toggle input:checked+.sl:before{background:var(--accent);transform:translateX(14px)}
.dim-row{display:flex;align-items:center;gap:6px;padding:4px 0;position:relative}
.dim-label{width:42px;font-size:0.78rem;color:var(--fg2);flex-shrink:0;text-align:right}
.dim-slider{-webkit-appearance:none;appearance:none;flex:1;height:4px;background:var(--bg3);border-radius:2px;outline:none;cursor:pointer;accent-color:var(--accent)}
.dim-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);cursor:pointer}
.dim-input{width:48px;font-family:var(--mono);font-size:0.75rem;padding:2px 4px;text-align:center;border:1px solid var(--border);border-radius:3px;background:var(--bg);color:var(--fg);-moz-appearance:textfield}
.dim-input::-webkit-inner-spin-button,.dim-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.hist-table{width:100%;border-collapse:collapse;font-size:0.74rem}
.hist-table th,.hist-table td{padding:3px 5px;text-align:center;border-bottom:1px solid var(--bg3)}
.hist-table th{color:var(--fg2);font-weight:500;font-size:0.7rem}
.hist-table td{color:var(--fg)}
.hist-table tr:hover{background:var(--bg2)}
.nav-item[draggable]{cursor:pointer;-webkit-user-select:none;user-select:none}
.nav-item[draggable]:active{cursor:pointer}
.nav-item.dragging{opacity:0.3}
.nav-item.drag-over{border-top:2px solid var(--accent)}
.drag-handle{color:var(--fg3);font-size:1.6rem;cursor:grab;opacity:0.35;transition:opacity 0.15s;width:24px;text-align:center;flex-shrink:0;user-select:none;line-height:0.7}
.nav-item:hover .drag-handle{opacity:0.8}
</style>
</head>
<body>
<div class="topbar">
  <h1>✦ 透闪石</h1>
  <span class="badge" id="statusBadge">connecting</span>
  <span class="sub" id="uptimeDisplay"></span>
  <button class="btn sm" onclick="location.reload()" style="font-size:0.7rem">↻</button>
</div>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="content" id="pageContent"><div class="loading">载入中...</div></div>
</div>

<script>
// ─── API helpers ────
async function api(path){const r=await fetch(path);return r.json()}
async function apiPost(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});return r.json()}
async function apiPut(path,body){const r=await fetch(path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});return r.json()}

// ─── Escape ────
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ─── Uptime ────
function fmtUptime(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;if(h>0)return h+'h '+m+'m';if(m>0)return m+'m '+sec+'s';return sec+'s'}

// ─── Navigation ────
const NAV_BASE=[
  {id:'status',ico:'\u25C9',label:'状态'},
  {id:'config',ico:'\u2699',label:'配置'},
  {id:'sessions',ico:'\u2630',label:'会话'},
  {id:'logs',ico:'\u2261',label:'日志'},
  {id:'chat',ico:'\uD83D\uDCAC',label:'对话'},
  {id:'profiles',ico:'\uD83D\uDCE6',label:'配置包'},
];
let currentPage='status',currentParam=null;

function navigate(page,param){
  currentPage=page;currentParam=param||null;
  location.hash='#'+page+(param?':'+param:'');
  renderNav();renderContent();
}

function renderNav(){
  const el=document.getElementById('sidebar');
  let html='';
  for(const n of NAV_BASE){
    html+='<div class="nav-item'+(currentPage===n.id?' active':'')+'" onclick="navigate(\''+n.id+'\')"><span class="ico">'+n.ico+'</span>'+esc(n.label)+'</div>';
  }
  html+='<div class="sep"></div>';
  // Dynamic modules
  api('/dashboard/status').then(d=>{
    const mods=d.modules||{};
    let registered=mods.registered||[];
    // Apply localStorage order override
    const saved=getModuleOrder();
    if(saved&&saved.length){
      const map={};for(const m of registered)map[m.name]=m;
      const ordered=[];const seen=new Set();
      for(const name of saved){if(map[name]){ordered.push(map[name]);seen.add(name)}}
      for(const m of registered)if(!seen.has(m.name))ordered.push(m);
      registered=ordered;
    }
    for(const m of registered){
      const isAct=currentPage==='module'&&currentParam===m.name;
      html+='<div class="nav-item'+(isAct?' active':'')+'" draggable="true" data-name="'+esc(m.name)+'" '+
        'ondragstart="dragStart(event)" ondragover="dragOver(event)" ondrop="dragDrop(event)" ondragend="dragEnd(event)" '+
        'onclick="navigate(\'module\',\''+esc(m.name)+'\')"><span class="drag-handle">☰</span><span class="ico">\u25C9</span>'+esc(m.label||m.name)+'</div>';
    }
    el.innerHTML=html;
  }).catch(()=>{el.innerHTML=html+'<div class="loading">无模块</div>'});
}

// ─── Pages ────
async function renderContent(){
  const el=document.getElementById('pageContent');
  // Pre-fetch status data for all pages
  let statusData={};
  try{ statusData=await api('/dashboard/status'); }catch(e){}
  const s=statusData.system||{};
  document.getElementById('statusBadge').textContent=statusData.system?'online':'offline';
  document.getElementById('uptimeDisplay').textContent='v'+(s.version||'?')+' · '+fmtUptime(s.uptime_secs||0);
  
  switch(currentPage){
    case 'status': await renderStatus(el,statusData);break;
    case 'chat': await renderChat(el,statusData);break;
    case 'config': await renderConfig(el,statusData);break;
    case 'sessions': await renderSessions(el,statusData);break;
    case 'logs': await renderLogs(el,statusData);break;
    case 'profiles': 
      if(currentParam) await renderProfileDetail(el,currentParam);
      else await renderProfiles(el,statusData);
    break;

    case 'module': await renderModule(el,currentParam,statusData);break;
    default: el.innerHTML='<div class="card"><div class="loading">未知页面: '+esc(currentPage)+'</div></div>';
  }
}

// ─── Status Page ────
async function renderStatus(el,d){
  try{

    const mc=d.memory||{};
    const sc=d.skills||{};
    const mods=d.modules||{};
    const lc=d.llm||{};

    let html='<div class="grid-2">';
    // Emotion card
    // Memory card
    html+='<div class="card"><div class="card-hd"><h3>\uD83D\uDCBE 记忆</h3></div>'+
      '<div class="row"><span class="l">总计</span><span class="v">'+(mc.total_entries||0)+'</span></div>'+
      '<div class="row"><span class="l">L1 / L2 / L3</span><span class="v">'+(mc.l1||0)+' / '+(mc.l2||0)+' / '+(mc.l3||0)+'</span></div>'+
      '<div class="row"><span class="l">RAM</span><span class="v">'+(mc.ram||0)+'</span></div></div>';
    html+='</div><div class="grid-2">';
    // Skills card
    html+='<div class="card"><div class="card-hd"><h3>\uD83D\uDCDA 学习</h3></div>'+
      '<div class="row"><span class="l">技能</span><span class="v">'+(sc.count||0)+'</span></div>'+
      '<div class="row"><span class="l">练习</span><span class="v">'+(sc.total_practices||0)+'</span></div></div>';
    // Modules card
    const reg=(mods.registered||[]).map(m=>'<span class="mod active">'+esc(m.label||m.name)+'</span>').join('');
    html+='<div class="card"><div class="card-hd"><h3>\uD83D\uDD0C 模块</h3></div>'+
      '<div class="module-list">'+(reg||'<span style="color:var(--fg3)">无</span>')+'</div></div>';
    html+='</div><div class="grid-2">';
    // LLM card
    html+='<div class="card"><div class="card-hd"><h3>\uD83D\uDD17 LLM</h3></div>'+
      '<div class="row"><span class="l">提供者</span><span class="v">'+((lc.providers||[]).join(', ')||'无')+'</span></div>'+
      '<div class="row"><span class="l">默认</span><span class="v">'+(lc.default||'离线')+'</span></div></div>';
    // Metrics card
    const mtx=d.metrics||{};
    html+='<div class="card"><div class="card-hd"><h3>\uD83D\uDCCA 指标</h3></div>'+
      '<div class="row"><span class="l">请求数</span><span class="v">'+(mtx.total_requests||0)+'</span></div>'+
      '<div class="row"><span class="l">活跃连接</span><span class="v">'+(mtx.active_connections||0)+'</span></div></div>';
    html+='</div>';
    el.innerHTML=html;
  }catch(e){
    el.innerHTML='<div class="error">加载失败: '+esc(e.message)+'</div>';
  }
}

// ─── Emotion Page ────
const EMOTION_DIMS={joy:'喜悦',trust:'信任',fear:'恐惧',surprise:'惊讶',sadness:'悲伤',disgust:'厌恶',anger:'愤怒',anticipation:'期待'};
const EMOTION_KEYS=['joy','trust','fear','surprise','sadness','disgust','anger','anticipation'];

async function renderEmotion(el){
  let d;
  try{ d=await api('/dashboard/emotion'); }catch(e){
    el.innerHTML='<div class="card"><div class="loading">情绪数据加载失败</div></div>'; return;
  }
  if(d.status!=='ok'||!d.data){
    el.innerHTML='<div class="card"><div class="loading">情绪数据不可用</div></div>'; return;
  }
  const cur=d.data.current||{},style=d.data.style||{},plutchik=cur.plutchik||{},history=d.data.history||[],version=d.data.version||'?',interval=d.data.auto_fluctuation_seconds||1800;
  let html='';
  // 顶部双栏
  html+='<div class="grid-2" id="emotion-status-cards">';
  html+='<div class="card"><div class="card-hd"><h3>❤ 情绪状态</h3></div>'+
    '<div class="row"><span class="l">主导情绪</span><span class="v"><span class="badge-accent">'+esc(style.style_label||'?')+'</span></span></div>'+
    '<div class="row"><span class="l">复合情绪</span><span class="v">'+esc(style.composite||'?')+'</span></div>'+
    '<div class="row"><span class="l">情绪维度</span><span class="v">'+esc(style.dominant||'?')+'</span></div></div>';
  html+='<div class="card"><div class="card-hd"><h3>✎ 风格注入</h3></div>'+
    '<div class="row"><span class="l">emoji</span><span class="v">'+esc(style.emoji||'')+'</span></div>'+
    '<div class="row"><span class="l">例句</span><span class="v" style="color:var(--accent);font-style:italic">"'+esc(style.example||'')+'"</span></div>'+
    (style.injection ? '<div style="margin-top:6px;padding:6px 8px;background:var(--bg2);border-radius:var(--radius-sm);font-size:0.72rem;font-family:var(--mono);white-space:pre-wrap;color:var(--fg2)">'+esc(style.injection)+'</div>' : '')+
    '</div>';
  html+='</div>';
  // 八维情绪滑块（2列）
  html+='<div class="card"><div class="card-hd"><h3>📊 Plutchik 八维情绪</h3></div><div class="grid-2">';
  const col1=['joy','trust','fear','surprise'],col2=['sadness','disgust','anger','anticipation'];
  for(const cols of [col1,col2]){
    html+='<div>';
    for(const key of cols){
      const label=EMOTION_DIMS[key]||key;
      const val=Math.round(plutchik[key]||50);
      html+='<div class="dim-row"><div class="dim-label">'+label+'</div>'+
        '<input type="range" class="dim-slider" min="0" max="100" value="'+val+'" data-key="'+key+'" oninput="updateSlider(this)" onclick="seekSlider(event)">'+
        '<input type="number" class="dim-input" min="0" max="100" value="'+val+'" onchange="updateNumber(this,\''+key+'\')"></div>';
    }
    html+='</div>';
  }
  html+='</div></div>';
  // 历史记录
  html+='<div class="card"><div class="card-hd"><h3>📜 情绪波动历史（最近10条）</h3></div>';
  if(!history.length) html+='<div class="loading">暂无记录</div>';
  else{
    const recent=history.slice(-10).reverse();
    html+='<table class="hist-table"><thead><tr><th>时间</th><th>类型</th><th>喜悦</th><th>信任</th><th>恐惧</th><th>惊讶</th><th>悲伤</th><th>厌恶</th><th>愤怒</th><th>期待</th><th>风格</th></tr></thead><tbody>';
    for(const h of recent){
      const t=new Date((h.timestamp||0)*1000);
      const ts=t.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      const tp=h.type==='fluctuation'?'自动波动':h.type==='manual_fluctuation'?'手动波动':'手动';
      const p=h.plutchik||{};
      html+='<tr><td>'+ts+'</td><td>'+tp+'</td>'+EMOTION_KEYS.map(k=>'<td>'+Math.round(p[k]||0)+'</td>').join('')+'<td>'+esc(h.style||'')+'</td></tr>';
    }
    html+='</tbody></table>';
  }
  html+='</div>';
  // 自动波动间隔
  html+='<div style="display:flex;align-items:center;gap:10px;padding:6px 0;font-size:0.78rem;margin-top:4px">'+
    '<span style="color:var(--fg2)">⏱ 自动波动</span>'+
    '<input type="number" class="dim-input" min="1" max="60" value="'+Math.round(interval/60)+'" onchange="updateInterval(this.value)" style="width:60px">'+
    '<span style="color:var(--fg3);font-size:0.72rem">分钟</span>'+
    '<span style="color:var(--fg3);font-size:0.7rem;margin-left:4px" id="intervalFeedback"></span>'+
    '</div>';
  // 底部按钮+版本号
  html+='<div style="display:flex;align-items:center;gap:12px;margin-top:4px">'+
    '<button class="btn" onclick="refreshEmotion()">↻ 刷新</button>'+
    '<button class="btn accent" onclick="fluctuateEmotion()">🌊 立即情绪波动</button>'+
    '<span style="margin-left:auto;color:var(--fg3);font-size:0.72rem">情绪引擎 v'+esc(version)+'</span></div>'+
    '</div>';
  el.innerHTML=html;
}

// ─── Emotion slider handlers ────
let emotionDebounce=null;
window.updateSlider=function(el){
  const key=el.dataset.key;
  const val=parseInt(el.value);
  el.nextElementSibling.value=val;
  clearTimeout(emotionDebounce);
  emotionDebounce=setTimeout(async()=>{
    await apiPost('/dashboard/emotion/update',{dimension:key,value:val});
    refreshEmotionCards();
  },300);
};
window.seekSlider=function(e){
  const el=e.target;
  const r=el.getBoundingClientRect();
  const v=Math.round(((e.clientX-r.left)/r.width)*100);
  el.value=Math.max(0,Math.min(100,v));
  el.dispatchEvent(new Event('input',{bubbles:true}));
};
window.updateNumber=function(el,key){
  const val=Math.min(100,Math.max(0,parseInt(el.value)||0));
  el.value=val;el.previousElementSibling.value=val;
  apiPost('/dashboard/emotion/update',{dimension:key,value:val}).then(()=>refreshEmotionCards());
};
window.refreshEmotion=function(){
  const el=document.getElementById('pageContent');
  const scroller=document.querySelector('.content');
  const savedTop=scroller?scroller.scrollTop:0;
  el.innerHTML='<div class="loading">刷新中...</div>';
  renderEmotion(el).then(()=>{
    if(scroller) requestAnimationFrame(()=>{scroller.scrollTop=savedTop;});
  });
};
async function refreshEmotionCards(){
  const container=document.getElementById('emotion-status-cards');
  if(!container)return;
  try{
    const d=await api('/dashboard/emotion');
    if(d.status!=='ok'||!d.data)return;
    const cur=d.data.current||{},style=d.data.style||{};
    container.innerHTML='<div class="card"><div class="card-hd"><h3>❤ 情绪状态</h3></div>'+

window.updateInterval=async function(minutes){
  const fb=document.getElementById('intervalFeedback');
  if(fb){fb.textContent='保存中...';fb.style.color='var(--fg2)';}
  try{
    const seconds=Math.max(60,Math.min(3600,(parseInt(minutes)||30)*60));
    const r=await apiPost('/dashboard/emotion/interval',{seconds});
    if(r.status==='ok'){
      if(fb){fb.textContent='✓ 已更新';fb.style.color='var(--green)';}
      setTimeout(()=>{if(fb)fb.textContent='';},2000);
    }else{
      if(fb){fb.textContent='✗ 失败';fb.style.color='var(--red)';}
    }
  }catch(e){
    if(fb){fb.textContent='✗ 网络错误';fb.style.color='var(--red)';}
  }
};

window.showChannelsAdd=function(){
  document.getElementById('channelsEditIdx').value='-1';
  document.getElementById('channelsEditId').value='';
  document.getElementById('channelsDlgTitle').textContent='添加通道';
  document.getElementById('chName').value='';
  document.getElementById('chType').value='QqBot';
  document.getElementById('chQqAppId').value='';
  document.getElementById('chQqSecret').value='';
  document.getElementById('chQqProduction').checked=false;
  document.getElementById('chNapCatWs').value='';
  document.getElementById('chHttpListen').value='';
  document.getElementById('chBroadcast').value='';
  switchChType();

};

window.showChannelsEdit=function(idx){
  const c=_channelsData[idx];
  if(!c)return;
  document.getElementById('channelsEditIdx').value=String(idx);
  document.getElementById('channelsEditId').value=c.id||'';
  document.getElementById('channelsDlgTitle').textContent='编辑通道';
  document.getElementById('chName').value=c.name||'';
  document.getElementById('chType').value=c.type||'QqBot';
  document.getElementById('chQqAppId').value=(c.config&&c.config.app_id)||'';
  document.getElementById('chQqSecret').value=(c.config&&c.config.client_secret)||'';
  document.getElementById('chQqProduction').checked=!!(c.config&&c.config.production);
  document.getElementById('chNapCatWs').value=(c.config&&c.config.ws_url)||'';
  document.getElementById('chHttpListen').value=(c.config&&c.config.listen)||'';
  document.getElementById('chBroadcast').value=c.broadcast_target||'';
  switchChType();
  document.getElementById('channelsDlg').style.display='flex';
};

window.closeChannelsDlg=function(){
  document.getElementById('channelsDlg').style.display='none';
};

window.doSaveChannel=async function(){
  const idx=parseInt(document.getElementById('channelsEditIdx').value||'-1');
  const id=document.getElementById('channelsEditId').value||('ch_'+Date.now());
  const name=document.getElementById('chName').value.trim()||'未命名';
  const type=document.getElementById('chType').value;
  const broadcast_target=document.getElementById('chBroadcast').value.trim()||'';

  let config={};
  if(type==='QqBot'){
    config={app_id:document.getElementById('chQqAppId').value.trim(),client_secret:document.getElementById('chQqSecret').value.trim(),production:document.getElementById('chQqProduction').checked};
  }else if(type==='NapCat'){
    config={ws_url:document.getElementById('chNapCatWs').value.trim()};
  }else if(type==='Http'){
    config={listen:document.getElementById('chHttpListen').value.trim()};
  }

  const channels=[..._channelsData];
  if(idx>=0){
    channels[idx]={id,name,type,config,broadcast_target};
  }else{
    channels.push({id,name,type,config,broadcast_target});
  }

  try{
    const r=await apiPost('/dashboard/channels/save',{channels});
    if(r.status==='ok'){
      closeChannelsDlg();
      _channelsData=channels;
      renderChannelsTable(document.getElementById('pageContent'));
    }else{
      alert('保存失败: '+(r.error||'未知错误'));
    }
  }catch(e){
    alert('网络错误');
  }
};

window.confirmDeleteChannel=function(idx,name){
  if(confirm('确定删除通道 '+name+' 吗？'))deleteChannel(idx);
};
window.deleteChannel=async function(idx){
  const channels=[..._channelsData];
  channels.splice(idx,1);
  try{
    const r=await apiPost('/dashboard/channels/save',{channels});
    if(r.status==='ok'){
      _channelsData=channels;
      renderChannelsTable(document.getElementById('pageContent'));
    }else{
      alert('删除失败');
    }
  }catch(e){
    alert('网络错误');
  }
};

};

window.switchCronType=function(m){
  const pb=document.getElementById('cronTypePrompt');
  const sb=document.getElementById('cronTypeShell');
  const h=document.getElementById('cronType');
  if(!pb||!sb||!h)return;
  if(m==='prompt'){
    pb.className='btn sm accent';sb.className='btn sm';
    h.value='prompt';
  }else{
    pb.className='btn sm';sb.className='btn sm accent';
    h.value='shell';
  }
};
window.switchCronMode=function(m){
  const t=document.getElementById('cronTimedPanel');
  const i=document.getElementById('cronIntervalPanel');
  const tb=document.getElementById('cronModeTimed');
  const ib=document.getElementById('cronModeInterval');
  if(!t||!i||!tb||!ib)return;
  if(m==='timed'){
    t.style.display='';i.style.display='none';
    tb.className='btn sm accent';ib.className='btn sm';
  }else{
    t.style.display='none';i.style.display='';
    tb.className='btn sm';ib.className='btn sm accent';
  }
  updateCronPreview();
};
window.updateCronPreview=function(){
  const t=document.getElementById('cronTimedPanel');
  const i=document.getElementById('cronIntervalPanel');
  const pre=document.getElementById('cronPreview');
  const hidden=document.getElementById('cronSched');
  if(!pre||!hidden)return;
  let cron='',label='';
  if(t&&t.style.display!=='none'){
    // 定时模式
    const h=parseInt(document.getElementById('cronHour')?.value||'0');
    const m=parseInt(document.getElementById('cronMinute')?.value||'0');
    cron='0 '+m+' '+h+' * * *';
    label='每天 '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+' 执行';
  }else if(i&&i.style.display!=='none'){
    // 间隔模式
    const n=parseInt(document.getElementById('cronIntervalNum')?.value||'30');
    const u=document.getElementById('cronIntervalUnit')?.value||'min';
    if(u==='min'){
      cron='0 */'+Math.max(1,n)+' * * * *';
      label='每隔 '+n+' 分钟执行一次';
    }else{
      cron='0 0 */'+Math.max(1,n)+' * * *';
      label='每隔 '+n+' 小时执行一次';
    }
  }
  hidden.value=cron;
  pre.textContent='📋 '+label+'  →  '+cron;
};
// ── 投递目标选择（数据由 Rust 服务端提供）──
window.loadChannels=async function(){
    const r=await api('/dashboard/cron/targets');
    if(!r||r.status!=='ok')return;
    const opts=r.options||[];
    // 存到全局，供 showCronAdd 和 onchange 使用
    window._cronDeliverOpts = opts;
    const sel=document.getElementById('cronDeliver');
    if(!sel)return;
    const current=sel.value;
    sel.innerHTML='';
    for(const o of opts){
        const el=document.createElement('option');
        el.value=o.value;
        const tc=o.targets&&o.targets.length?(' — '+o.targets.length+' 个目标'):'';
        el.textContent=o.label+tc;
        sel.appendChild(el);
    }
    if(current)sel.value=current;
    sel.onchange=function(){updateDeliverTarget(window._cronDeliverOpts);};
    updateDeliverTarget(window._cronDeliverOpts);
};
window.updateDeliverTarget=function(opts){
  const wrap=document.getElementById('cronDeliverTargetWrap');
  const tsel=document.getElementById('cronDeliverTarget');
  const dv=document.getElementById('cronDeliver').value;
  if(!wrap||!tsel)return;
  // 找到当前选中选项
  const cur=opts.find(o=>o.value===dv);
  const targets=cur&&cur.targets?cur.targets:[];
  if(!targets.length){
    wrap.style.display='none';
    return;
  }
  tsel.innerHTML='<option value="">使用通道默认目标</option>';
  for(const t of targets){
    const opt=document.createElement('option');
    opt.value=t;
    opt.textContent=t;
    tsel.appendChild(opt);
  }
  wrap.style.display='block';
};

window.showCronAdd=function(){
  document.getElementById('cronEditIdx').value='-1';
  document.getElementById('cronDlgTitle').textContent='新建定时任务';
  document.getElementById('cronName').value='';
  document.getElementById('cronCmd').value='';

  switchCronType('prompt');
  document.getElementById('cronHour').value='0';
  document.getElementById('cronMinute').value='0';
  document.getElementById('cronIntervalNum').value='30';
  document.getElementById('cronIntervalUnit').value='min';
  switchCronMode('timed');
  // 刷新子目标选择框状态
  if(window._cronDeliverOpts) updateDeliverTarget(window._cronDeliverOpts);
  const d=document.getElementById('cronAddDlg');

window.showCronEdit=async function(idx){
  // 获取当前任务数据
  const r=await api('/dashboard/engine/cron');
  if(!r||r.status!=='ok')return;
  const tasks=r.data['任务列表']||[];
  const t=tasks[idx];
  if(!t)return;
  document.getElementById('cronEditIdx').value=String(idx);
  document.getElementById('cronDlgTitle').textContent='修改定时任务';
  document.getElementById('cronName').value=t.name||'';
  document.getElementById('cronCmd').value=t.command||t.content||'';
  document.getElementById('cronDeliver').value=t.deliver||'origin';
  switchCronType(t.type==='prompt'?'prompt':'shell');
  // 尝试从cron表达式反推模式
  const sched=t.schedule||'';
  if(sched.match(/^\d+ \*\/\d+/)){
    // 间隔模式
    const parts=sched.split(' ');
    if(parts[1]&&parts[1].startsWith('*/')){
      document.getElementById('cronIntervalNum').value=parts[1].slice(2);
      document.getElementById('cronIntervalUnit').value=sched.startsWith('0 0 */')?'hour':'min';
      switchCronMode('interval');
    }
  }else{
    // 定时模式
    const parts=sched.split(' ');
    if(parts.length>=3){
      document.getElementById('cronHour').value=parts[2]||'0';
      document.getElementById('cronMinute').value=parts[1]||'0';
    }
    switchCronMode('timed');
  }
  updateCronPreview();
  const d=document.getElementById('cronAddDlg');
  if(d)d.style.display='flex';
};
window.doAddCron=async function(){
  const idx=parseInt(document.getElementById('cronEditIdx').value||'-1');
  const n=document.getElementById('cronName').value.trim()||'未命名';
  const c=document.getElementById('cronSched').value||'0 */30 * * * *';
  const cmd=document.getElementById('cronCmd').value.trim()||'';
  const tp=document.getElementById('cronType').value||'prompt';
  const dv_raw=document.getElementById('cronDeliver').value.trim()||'origin';
  const dt=document.getElementById('cronDeliverTarget');
  const target=dt&&dt.value?':'+dt.value:'';
  const dv=dv_raw+target;
  const body={name:n,schedule:c,command:cmd,deliver:dv};
  if(tp==='prompt')body.type='prompt';
  if(idx>=0){
    await apiPost('/dashboard/cron/'+idx+'/update',body);
  }else{
    await apiPost('/dashboard/cron/create',body);
  }
  document.getElementById('cronAddDlg').style.display='none';
  reloadCron();
};
window.reloadCron=async function(){
  const el=document.getElementById('pageContent');
  const tb=document.getElementById('cronTaskSection');
  try{
    const d=await api('/dashboard/engine/cron');
    if(d.status==='ok'){
      if(tb){
        // 有表格了，只更新表格内的数据
        const oldData=window._cronData||{};
        window._cronData=d.data;
        const tasks=d.data['任务列表']||[];
        // 只更新表格行，不重绘整个页面
        const rows=el.querySelectorAll('.hist-table tbody tr');
        if(rows.length===tasks.length){
          for(let i=0;i<tasks.length;i++){
            const t=tasks[i];
            const lr=t.last_run&&t.last_run!==0?new Date(t.last_run*1000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):'—';
            const st=t.enabled?'<span style="color:var(--green);display:inline-block;width:64px">🟢 启用</span>':'<span style="color:var(--fg3);display:inline-block;width:64px">🔴 暂停</span>';
            const tg=t.enabled?'⏸':'▶';
            const cells=rows[i].querySelectorAll('td');
            if(cells.length>=7){
              cells[5].innerHTML=st;
              cells[6].innerHTML=lr;
              const ops=cells[7].querySelectorAll('button');
              if(ops.length>=1)ops[0].innerHTML=tg;
            }
          }
          return;
        }
      }
      renderCronPage(el,d.data);
    }else el.innerHTML='<div class="error">加载失败</div>';
  }catch(e){if(!tb)el.innerHTML='<div class="error">网络错误</div>';}
};
// 定时自动刷新cron页面（每5秒）
let _cronRefreshTimer=null;
window.startCronAutoRefresh=function(){
  if(_cronRefreshTimer)return;
  _cronRefreshTimer=setInterval(()=>{
    const el=document.getElementById('pageContent');
    if(el&&el.querySelector('.hist-table'))reloadCron();
  },5000);
};
window.stopCronAutoRefresh=function(){
  if(_cronRefreshTimer){clearInterval(_cronRefreshTimer);_cronRefreshTimer=null;}
};

// ─── Drag-and-drop module ordering ────
let dragSrcName=null;
function dragStart(e){
  dragSrcName=e.target.closest('.nav-item').dataset.name;
  e.dataTransfer.effectAllowed='move';
  setTimeout(()=>e.target.closest('.nav-item').classList.add('dragging'),0);
}
function dragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  const t=e.target.closest('.nav-item');
  if(t&&t.dataset.name!==dragSrcName){
    document.querySelectorAll('.nav-item.drag-over').forEach(el=>el.classList.remove('drag-over'));
    t.classList.add('drag-over');
  }
}
function dragDrop(e){
  e.preventDefault();
  const t=e.target.closest('.nav-item');
  if(!t||!dragSrcName||t.dataset.name===dragSrcName)return;
  const sb=document.getElementById('sidebar');
  const src=sb.querySelector('[data-name="'+dragSrcName+'"]');
  if(!src||!t)return;
  const all=Array.from(sb.querySelectorAll('.nav-item[draggable]'));
  const si=all.indexOf(src),ti=all.indexOf(t);
  if(si<0||ti<0)return;
  if(si<ti)t.parentNode.insertBefore(src,t.nextSibling);
  else t.parentNode.insertBefore(src,t);
  saveModuleOrder();
  dragSrcName=null;
}
function dragEnd(e){
  const item=e.target.closest('.nav-item');
  if(item)item.classList.remove('dragging');
  document.querySelectorAll('.nav-item.drag-over').forEach(el=>el.classList.remove('drag-over'));
}
function getModuleOrder(){
  try{return JSON.parse(localStorage.getItem('tremolite_mod_order'))}catch(e){return null}
}
function saveModuleOrder(){
  const sb=document.getElementById('sidebar');
  const names=Array.from(sb.querySelectorAll('.nav-item[draggable]')).map(el=>el.dataset.name);
  try{localStorage.setItem('tremolite_mod_order',JSON.stringify(names))}catch(e){}
}

window.refreshMemoryPage=function(){
  var el=document.getElementById('pageContent');
  var scroller=document.querySelector('.content');
  var savedTop=scroller?scroller.scrollTop:0;
  el.innerHTML='<div class="loading">刷新中...</div>';
  api('/dashboard/engine/memory').then(function(d){
    if(d.status==='ok'&&d.data){
      renderMemoryPage(el,d.data);
      if(scroller) requestAnimationFrame(function(){scroller.scrollTop=savedTop;});
    }else{
      el.innerHTML='<div class="error">刷新失败</div>';
    }
  }).catch(function(e){
    el.innerHTML='<div class="error">网络错误: '+esc(e.message)+'</div>';
  });
};

function switchMemTab(tab){
  document.querySelectorAll('[id^="memTabBtn_"]').forEach(function(btn){
    btn.style.background='var(--bg)';
    btn.style.borderLeft='3px solid var(--border)';
  });
  var btn=document.getElementById('memTabBtn_'+tab);
  if(btn) btn.style.background='var(--accent-dim)';
  
  renderMemTabContent(tab);
}

function tabLabel(tab){
  var m={'l1':'L1 工作记忆','l2':'L2 画像记忆','l3':'L3 索引层','ram':'RAM 缓存','disk':'Disk 归档'};
  return m[tab]||tab;
}

// 记忆中搜索
function doMemSearch(){
  var q=document.getElementById('memSearchInput').value.trim();
  if(!q){ return; }
  var el=document.getElementById('memSearchResults');
  el.innerHTML='<div class="loading">搜索中...</div>';
  api('/dashboard/engine/memory/search?q='+encodeURIComponent(q)).then(function(d){
    if(d.status!=='ok'||!d.results){
      el.innerHTML='<div class="card"><div class="error">搜索失败</div></div>';
      return;
    }
    var results=d.results||[];
    var html='<div class="card"><div class="card-hd"><h3>🔍 搜索结果</h3><span style="font-size:0.72rem;color:var(--fg3)">共 '+results.length+' 条</span>'+
      '<span style="font-size:0.65rem;color:var(--fg3);margin-left:8px">'+esc(d.memory_path||'')+'</span></div>';
    
    if(results.length===0){
      html+='<div style="padding:12px;text-align:center;color:var(--fg3);font-size:0.8rem">未找到匹配条目</div></div>';
      el.innerHTML=html;
      return;
    }
    
    for(var i=0;i<results.length;i++){
      var r=results[i];
      var layerColor={'l2':'#2196F3','l3':'#FF9800','disk':'#607D8B'};
      var layerLabel={'l2':'L2 画像','l3':'L3 索引+RAM','disk':'Disk 归档'};
      
      html+='<div style="padding:8px;border-bottom:1px solid var(--bg3);font-size:0.75rem;'+(i%2===1?'background:var(--bg2)':'')+'">'+
        '<div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:4px">'+
        '<span class="badge-accent" style="background:'+(layerColor[r.layer]||'var(--accent)')+';color:#fff;font-size:0.65rem;padding:1px 6px;border-radius:3px">'+esc(layerLabel[r.layer]||r.layer)+'</span>'+
        '<div style="display:flex;gap:4px">'+
        '<button class="btn sm" onclick="editMemItem(\''+esc(r.layer)+'\',\''+esc(r.id_str||r.key||String(r.id))+'\','+(r.id||0)+')" style="padding:2px 6px;font-size:0.7rem">✏️</button>'+
        '<button class="btn sm" onclick="deleteMemItem(\''+esc(r.layer)+'\',\''+esc(r.id_str||r.key||String(r.id))+'\','+(r.id||0)+')" style="padding:2px 6px;font-size:0.7rem;color:#f44336">🗑️</button>'+
        '</div></div>';
      
      if(r.layer==='l2'){
        html+='<div style="color:var(--fg2);margin:2px 0">'+esc((r.content||'').substring(0,200))+'</div>'+
          (r.tags?'<div style="display:flex;gap:3px;flex-wrap:wrap;margin-top:2px">'+(Array.isArray(r.tags)?r.tags.map(function(t){return '<span style="font-size:0.65rem;background:var(--bg2);padding:1px 4px;border-radius:3px;color:var(--fg3)">'+esc(typeof t==='string'?t:JSON.stringify(t))+'</span>';}).join(''):'')+'</div>':'')+
          (r.importance!==undefined?'<div style="font-size:0.65rem;color:var(--fg3);margin-top:2px">重要度: '+(typeof r.importance==='number'?r.importance.toFixed(2):r.importance)+'</div>':'');
      }else if(r.layer==='l3'){
        html+='<div style="color:var(--fg2);margin:2px 0"><strong>摘要：</strong>'+esc(r.summary||'')+'</div>'+
          (r.ram_content?'<div style="margin-top:4px;padding:4px 6px;background:var(--bg);border-radius:var(--radius-sm);border-left:3px solid #9C27B0"><span style="color:#9C27B0;font-size:0.65rem">📦 RAM 完整内容：</span><div style="color:var(--fg2);font-size:0.72rem;margin-top:2px">'+esc(r.ram_content.substring(0,300))+'</div></div>':'')+
          (r.has_embedding?'<span style="font-size:0.65rem;color:#9C27B0">🧠 有向量</span>':'');
      }else if(r.layer==='disk'){
        html+='<div style="color:var(--fg2);margin:2px 0"><strong>关键词：</strong>'+esc(r.keyword||'')+'</div>'+
          (r.store_content?'<div style="margin-top:4px;padding:4px 6px;background:var(--bg);border-radius:var(--radius-sm);border-left:3px solid #607D8B"><span style="color:#607D8B;font-size:0.65rem">🗄️ Disk Store 完整内容：</span><div style="color:var(--fg2);font-size:0.72rem;margin-top:2px">'+esc(r.store_content.substring(0,300))+'</div></div>':'');
      }
      
      html+=(r.created_at?'<div style="font-size:0.65rem;color:var(--fg3);margin-top:2px">'+(new Date(r.created_at*1000)).toLocaleString()+'</div>':'')+
        '</div>';
    }
    
    html+='</div>';
    el.innerHTML=html;
  }).catch(function(e){
    el.innerHTML='<div class="card"><div class="error">网络错误: '+esc(e.message)+'</div></div>';
  });
}

function deleteMemItem(layer, idStr, idNum){
  if(!confirm('确定要删除这条 '+layer.toUpperCase()+' 记忆条目？\n'+(layer==='l3'?'（将同时删除对应的 RAM 内容）':'')+(layer==='disk'?'（将同时删除对应的 Disk Store 文件）':''))) return;
  api('/dashboard/engine/memory/delete', {
    method:'POST',
    body:JSON.stringify({layer:layer, id_str:idStr, id_num:idNum}),
    headers:{'Content-Type':'application/json'}
  }).then(function(d){
    if(d.status==='ok'){
      doMemSearch();
    }else{
      alert('删除失败');
    }
  }).catch(function(e){
    alert('网络错误: '+e.message);
  });
}

function editMemItem(layer, idStr, idNum){
  api('/dashboard/engine/memory/search?q='+encodeURIComponent(document.getElementById('memSearchInput').value.trim())).then(function(d){
    if(d.status!=='ok'||!d.results) return;
    var currentContent='';
    for(var i=0;i<d.results.length;i++){
      var r=d.results[i];
      var rid=r.id_str||r.key||String(r.id);
      if(r.layer===layer && rid===idStr){
        currentContent=r.content||r.summary||r.keyword||r.ram_content||r.store_content||'';
        break;
      }
    }
    var newContent=prompt('编辑 '+layer.toUpperCase()+' 记忆内容：', currentContent);
    if(newContent===null||newContent.trim()==='') return;
    api('/dashboard/engine/memory/update', {
      method:'POST',
      body:JSON.stringify({layer:layer, id_str:idStr, id_num:idNum, content:newContent.trim()}),
      headers:{'Content-Type':'application/json'}
    }).then(function(r2){
      if(r2.status==='ok'){
        doMemSearch();
      }else{
        alert('更新失败');
      }
    }).catch(function(e2){
      alert('网络错误: '+e2.message);
    });
  }).catch(function(e){
    alert('网络错误: '+e.message);
  });
}

// 上传头像
function uploadAvatar(input, type){
  var file=input.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){
    alert('请选择图片文件');
    return;
  }
  var formData=new FormData();
  formData.append('type', type);
  formData.append('file', file);

  fetch('/dashboard/config/avatar/upload', {
    method:'POST',
    body:formData
  }).then(function(r){ return r.json(); }).then(function(d){
    if(d.status==='ok'){
      var imgId=(type==='user'?'cfgUserAvatarImg':'cfgAiAvatarImg');
      document.getElementById(imgId).src=d.avatar_url;
      // 自动保存名字（同时更新 profile.json 中的头像路径）
      var username=document.getElementById('cfgUsername').value.trim();
      var ai_name=document.getElementById('cfgAiName').value.trim();
      var user_avatar=(type==='user'?d.avatar_url.replace('/avatars/',''):document.getElementById('cfgUserAvatarImg').src.replace(/^.*\/avatars\//,''));
      var ai_avatar=(type==='ai'?d.avatar_url.replace('/avatars/',''):document.getElementById('cfgAiAvatarImg').src.replace(/^.*\/avatars\//,''));
      fetch('/dashboard/config/profile', {
        method:'POST',
        body:JSON.stringify({username:username, ai_name:ai_name, user_avatar:user_avatar, ai_avatar:ai_avatar}),
        headers:{'Content-Type':'application/json'}
      });
    }else{
      alert('上传失败: '+(d.error||''));
    }
  }).catch(function(e){
    alert('上传失败');
  });
}

// 自动保存名字和头像路径
function autoSaveName(){
  var username=document.getElementById('cfgUsername').value.trim();
  var ai_name=document.getElementById('cfgAiName').value.trim();
  var userAvatarSrc=document.getElementById('cfgUserAvatarImg').src;
  var aiAvatarSrc=document.getElementById('cfgAiAvatarImg').src;
  var user_avatar=userAvatarSrc.includes('/avatars/')?userAvatarSrc.split('/avatars/')[1]:'';
  var ai_avatar=aiAvatarSrc.includes('/avatars/')?aiAvatarSrc.split('/avatars/')[1]:'';
  if(window._autoSaveTimer) clearTimeout(window._autoSaveTimer);
  window._autoSaveTimer=setTimeout(function(){
    fetch('/dashboard/config/profile', {
      method:'POST',
      body:JSON.stringify({username:username, ai_name:ai_name, user_avatar:user_avatar, ai_avatar:ai_avatar}),
      headers:{'Content-Type':'application/json'}
    });
  }, 500);
}

// 手动保存（保留供兼容）
function saveProfileConfig(){ autoSaveName(); }
