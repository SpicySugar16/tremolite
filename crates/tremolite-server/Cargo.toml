[package]
name = "tremolite-server"
version = "0.3.0"
edition = "2021"
description = "HTTP API server + HttpChannel + NapCatChannel"

[dependencies]
axum.workspace = true
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tower-http = { workspace = true, features = ["cors"] }
tracing.workspace = true
futures-util.workspace = true
async-trait = "0.1"
tremolite-core = { path = "../tremolite-core" }
tremolite-llm = { path = "../tremolite-llm" }
tremolite-tools = { path = "../tremolite-tools" }
tremolite-config = { path = "../tremolite-config" }
tremolite-emotion = { path = "../tremolite-emotion" }
tremolite-dashboard = { path = "../tremolite-dashboard" }
tremolite-message = { path = "../tremolite-message" }
tremolite-channels = { path = "../tremolite-channels" }
tremolite-cron = { path = "../tremolite-cron" }
toml = "0.8"
